name: 发布容器镜像

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 镜像标签，例如 v0.0.1
        required: true
        type: string

concurrency:
  group: publish-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: 构建并推送
    runs-on: ubuntu-latest
    steps:
      - name: 校验标签
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$IMAGE_TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "无效的镜像标签: $IMAGE_TAG" >&2
            echo "标签须为 1 到 128 个字符，只能包含字母、数字、下划线、点、连字符，且不能以点或连字符开头。" >&2
            exit 1
          fi

      - name: 检出代码
        uses: actions/checkout@v7

      - name: 确定镜像名
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/yijian" >> "$GITHUB_OUTPUT"

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.image.outputs.name }}:${{ inputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.tag }}

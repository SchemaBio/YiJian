<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- 旋转参数 (rotate) 赋予了从左上到右下的斜向游动姿态 -->
  <g transform="rotate(15, 100, 100)">
    
    <!-- 乌贼头部 (Mantle) -->
    <!-- 底部曲线向上拱起，与触须顶部形成流线型的负空间 -->
    <path fill="#0f766e" d="
      M 50 92
      C 40 50, 70 20, 100 20
      C 130 20, 160 50, 150 92
      C 120 75, 80 75, 50 92 Z
    "/>
    
    <!-- 聚拢的触须 (Tentacles) -->
    <!-- 包含4条简化的触须，两边微翘，中间收拢，结构安全且极具辨识度 -->
    <path fill="#0f766e" d="
      M 55 100
      C 35 115, 15 140, 30 155
      C 45 145, 60 135, 70 120
      C 75 140, 75 165, 85 175
      C 90 155, 95 130, 100 110
      C 105 130, 110 155, 115 175
      C 125 165, 125 140, 130 120
      C 140 135, 155 145, 170 155
      C 185 140, 165 115, 145 100
      C 120 85, 80 85, 55 100 Z
    "/>
    
  </g>
</svg>
